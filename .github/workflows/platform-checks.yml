name: Platform adapters and Android preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remote-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - name: Format source and export dependency resolution
        env:
          REMOTE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, pathlib, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['REMOTE_BASE_SHA']], text=True).splitlines()
          sources = [p for p in changed if p.endswith('.dart') and pathlib.Path(p).is_file()]
          if sources:
              subprocess.run(['dart', 'format', *sources], check=True)
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          files = {p: pathlib.Path(p).read_text() for p in paths if p.endswith('.dart') or p == 'pubspec.lock'}
          encoded = base64.b64encode(gzip.compress(json.dumps(files).encode())).decode()
          print('REMOTE_GENERATED_FILES=' + encoded)
          PY
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build ARM64 Android preview
        run: flutter build apk --release --target-platform android-arm64
      - name: Save preview APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-platforms-android-preview
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
          if-no-files-found: error
