# Cloud iOS builds — this file is why the project does not need a Mac.
#
# Codemagic runs these workflows on its own macOS machines with Xcode already
# installed. You push from Windows; an .ipa comes back.
#
# Three workflows, in the order you are likely to want them:
#
#   ios-unsigned    No Apple membership needed. Sign it yourself on Windows
#                   with a free Apple ID. Start here.
#   ios-debug       Needs the $99/yr membership. Signed ad-hoc build that
#                   installs over the air and lasts a year, not 7 days.
#   ios-testflight  Needs the membership. For handing it to other people.
#
# Note the $99 is billed ANNUALLY, not once. Let it lapse and signed builds
# stop working — which is the main argument for staying on ios-unsigned until
# the app is something you actually rely on.
#
# Setup for the signed workflows, once:
#   1. codemagic.io -> add this repository
#   2. Teams -> Code signing identities -> connect your Apple Developer account
#   3. Create an App Store Connect API key, add it as the `codemagic` integration
#
# The bundle identifier below must match ios/Runner.xcodeproj exactly, camel
# case included — Apple treats com.wiantribe.universalremote and
# com.wiantribe.universalRemote as different apps.

definitions:
  env_versions: &env_versions
    flutter: stable
    # Pinned rather than `latest`. Codemagic moves `latest` whenever Apple
    # ships a new Xcode, so a build that passed last week can fail untouched.
    # 26.6 is Codemagic's current default and the best tested against Flutter
    # stable; raise it deliberately, after a build you watched succeed.
    xcode: 26.6
    cocoapods: default

workflows:
  # START HERE if you have no Apple Developer membership.
  #
  # Produces an UNSIGNED .ipa. Codemagic never touches your Apple account, so
  # this workflow needs no certificates, no API key and no $99 — it just
  # compiles on a Mac, which is the part Windows cannot do.
  #
  # You then sign it yourself on Windows with AltStore or Sideloadly, using a
  # free Apple ID. What that costs you instead of money:
  #   * the app stops opening after 7 days and must be refreshed
  #     (AltStore can refresh automatically over Wi-Fi)
  #   * at most 3 sideloaded apps on the device at once
  #   * no push notifications or paid-only entitlements
  #
  # None of that affects this app: Local Network access, which is all it needs,
  # is available to free provisioning.
  ios-unsigned:
    name: iOS unsigned .ipa (sideload with a free Apple ID)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      <<: *env_versions
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit tests
        script: flutter test

      - name: Build unsigned .app
        script: flutter build ios --release --no-codesign

      - name: Wrap it as an .ipa
        # An .ipa is just a zip with the .app inside a Payload/ directory.
        # `flutter build ipa` refuses without signing, so the wrapping is done
        # by hand here.
        script: |
          set -e
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q universal-remote-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/ipa/*.ipa

  ios-debug:
    name: iOS ad-hoc build (install on your own iPhone)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      <<: *env_versions
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.wiantribe.universalRemote
      vars:
        BUNDLE_ID: "com.wiantribe.universalRemote"
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze

      - name: Unit tests
        script: flutter test

      - name: Set up signing
        script: |
          # Pulls the ad-hoc profile Codemagic generated and points Xcode at it.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build .ipa
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      email:
        recipients:
          # Where the .ipa download link is sent when this workflow finishes.
          - atoyejet@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      <<: *env_versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wiantribe.universalRemote
      vars:
        BUNDLE_ID: "com.wiantribe.universalRemote"
        # The numeric "Apple ID" of the app record in App Store Connect
        # ("Universal Remote by WianTribe"). It is also the number in the app's
        # App Store Connect URL: /apps/<this id>/distribution.
        APP_APPLE_ID: "6823485096"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          flutter build ipa --release \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID") + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android:
    name: Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
